<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>just a flight sim</title>
  <style>
    :root {
      --cabin: #14110e;
      --panel: #2b261f;
      --panel-edge: #3f392f;
      --inset: #100e0b;
      --amber: #e4a54a;
      --amber-dim: #8a6424;
      --cream: #efe4d2;
      --mute: #9a8d7a;
      --rec: #c4372c;
      --ok: #6faf6a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--cabin);
      color: var(--cream);
      font-family: "Avenir Next Condensed", "Helvetica Neue", Arial Narrow, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(228, 165, 74, 0.08), transparent 60%),
        repeating-linear-gradient(180deg, #16130f 0 2px, #12100c 2px 4px);
    }

    .frame {
      width: min(460px, 100%);
      background: linear-gradient(180deg, #353028, var(--panel) 28%, #221e19);
      border: 1px solid var(--panel-edge);
      border-radius: 6px;
      padding: 18px 18px 16px;
    }

    .plate {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--mute);
      margin-bottom: 14px;
    }

    .plate strong {
      color: var(--amber);
      font-weight: 700;
      font-size: 13px;
      text-transform: none;
      letter-spacing: 0.04em;
    }

    .screen {
      background: var(--inset);
      border: 1px solid #4a4338;
      min-height: 92px;
      padding: 14px 16px 12px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mute);
    }

    #status {
      color: var(--amber);
      font-weight: 700;
    }

    #timer {
      font-variant-numeric: tabular-nums;
      color: var(--cream);
    }

    .meter {
      margin-top: 14px;
      height: 8px;
      background: #1c1813;
      overflow: hidden;
    }

    #meter-fill {
      height: 100%;
      width: 0%;
      background: var(--amber);
    }

    .talk {
      width: 100%;
      height: 92px;
      border: 0;
      background: #8d211b;
      color: #fff4ea;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font: 700 18px/1 inherit;
      cursor: pointer;
    }

    .talk:hover { background: #a32820; }
    .talk:active { transform: translateY(1px); }
    .talk.live { background: var(--rec); }
    .talk:disabled { opacity: 0.45; cursor: default; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .ghost {
      height: 44px;
      border: 1px solid #5a5246;
      background: #1d1a15;
      color: var(--cream);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font: 600 12px/1 inherit;
      cursor: pointer;
    }

    .ghost:hover { border-color: var(--amber); color: var(--amber); }
    .ghost:disabled {
      opacity: 0.35;
      cursor: default;
      border-color: #3a342c;
      color: var(--mute);
    }

    .note {
      margin: 12px 2px 0;
      color: var(--mute);
      font-size: 12px;
      line-height: 1.45;
      letter-spacing: 0.02em;
    }

    .note.error { color: #e08a7a; }
  </style>
</head>
<body>
  <main class="frame">
    <div class="plate">
      <strong>just a flight sim</strong>
      <span>Crew Station</span>
    </div>

    <section class="screen">
      <div class="status-row">
        <span id="status">Ready</span>
        <span id="timer">00:00</span>
      </div>
      <div class="meter" aria-hidden="true">
        <div id="meter-fill"></div>
      </div>
    </section>

    <button id="talk" class="talk" type="button">Begin Announcement</button>

    <div class="row">
      <button id="preview" class="ghost" type="button" disabled>Preview</button>
      <button id="export" class="ghost" type="button" disabled>Export PA</button>
    </div>

    <p id="note" class="note">Press the button. The chime plays and recording starts. Export applies a light cabin-speaker grain to your voice.</p>
  </main>

    const talkBtn = document.getElementById("talk");
    const previewBtn = document.getElementById("preview");
    const exportBtn = document.getElementById("export");
    const statusEl = document.getElementById("status");
    const timerEl = document.getElementById("timer");
    const meterFill = document.getElementById("meter-fill");
    const noteEl = document.getElementById("note");

    let audioCtx = null;
    let chimeBuffer = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlob = null;
    let processedBlob = null;
    let previewAudio = null;
    let recStart = 0;
    let timerId = 0;
    let meterId = 0;
    let analyser = null;
    let meterSource = null;
    let recording = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setNote(text, isError) {
      noteEl.textContent = text;
      noteEl.classList.toggle("error", Boolean(isError));
    }

    function formatTime(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const m = String(Math.floor(total / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return m + ":" + s;
    }

    function ensureContext() {
      if (!audioCtx) audioCtx = new AudioContext();
      return audioCtx;
    }

    async function loadChime() {
      if (chimeBuffer) return chimeBuffer;
      const ctx = ensureContext();
      const res = await fetch(CHIME_URL);
      const buf = await res.arrayBuffer();
      chimeBuffer = await ctx.decodeAudioData(buf.slice(0));
      return chimeBuffer;
    }

    async function playChime() {
      const ctx = ensureContext();
      if (ctx.state === "suspended") await ctx.resume();
      const buffer = await loadChime();
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      source.start();
      return buffer.duration;
    }

    function pickMime() {
      const types = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/mp4",
        "audio/ogg;codecs=opus"
      ];
      return types.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function startMeter(stream) {
      const ctx = ensureContext();
      analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      meterSource = ctx.createMediaStreamSource(stream);
      meterSource.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);

      const tick = () => {
        analyser.getByteTimeDomainData(data);
        let peak = 0;
        for (let i = 0; i < data.length; i++) {
          peak = Math.max(peak, Math.abs(data[i] - 128));
        }
        meterFill.style.width = Math.min(100, peak * 1.8) + "%";
        meterId = requestAnimationFrame(tick);
      };
      tick();
    }

    function stopMeter() {
      cancelAnimationFrame(meterId);
      meterFill.style.width = "0%";
      try { meterSource && meterSource.disconnect(); } catch (_) {}
      meterSource = null;
      analyser = null;
    }

    function startTimer() {
      recStart = performance.now();
      timerEl.textContent = "00:00";
      timerId = setInterval(() => {
        timerEl.textContent = formatTime(performance.now() - recStart);
      }, 200);
    }

    function stopTimer() {
      clearInterval(timerId);
    }

    async function startAnnouncement() {
      recordedChunks = [];
      recordedBlob = null;
      processedBlob = null;
      previewBtn.disabled = true;
      exportBtn.disabled = true;
      talkBtn.disabled = true;
      setNote("Requesting microphone…");

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
      } catch (err) {
        talkBtn.disabled = false;
        setStatus("Ready");
        setNote("Microphone access is required to record.", true);
        return;
      }

      const mime = pickMime();
      mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size) recordedChunks.push(event.data);
      };

      mediaRecorder.onstop = () => {
        stream.getTracks().forEach((track) => track.stop());
        recordedBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        recording = false;
        talkBtn.disabled = false;
        talkBtn.classList.remove("live");
        talkBtn.textContent = "Begin Announcement";
        previewBtn.disabled = false;
        exportBtn.disabled = false;
        stopMeter();
        stopTimer();
        setStatus("Recorded");
        setNote("Preview the cabin mix, or export a WAV with the PA grain applied.");
      };

      try {
        await playChime();
      } catch (err) {
        stream.getTracks().forEach((track) => track.stop());
        talkBtn.disabled = false;
        setNote("Could not play the PA chime.", true);
        return;
      }

      mediaRecorder.start();
      recording = true;
      startMeter(stream);
      startTimer();
      talkBtn.disabled = false;
      talkBtn.classList.add("live");
      talkBtn.textContent = "End Transmission";
      setStatus("Live");
      setNote("Recording. Speak after the chime.");
    }

    function stopAnnouncement() {
      if (!mediaRecorder || mediaRecorder.state === "inactive") return;
      talkBtn.disabled = true;
      setStatus("Stopping");
      mediaRecorder.stop();
    }

    function distortionCurve(amount) {
      const samples = 2048;
      const curve = new Float32Array(samples);
      const k = amount;
      for (let i = 0; i < samples; i++) {
        const x = (i * 2) / samples - 1;
        curve[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
      }
      return curve;
    }

    function makeNoiseBuffer(ctx, length) {
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let last = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        last = last * 0.86 + white * 0.14;
        data[i] = last * 0.7 + white * 0.08;
      }
      return buffer;
    }

    function addGrain(channel) {
      const steps = 220;
      for (let i = 0; i < channel.length; i++) {
        const hiss = (Math.random() * 2 - 1) * 0.007;
        let sample = channel[i] + hiss;
        sample = Math.round(sample * steps) / steps;
        if (sample > 0.92) sample = 0.92;
        if (sample < -0.92) sample = -0.92;
        channel[i] = sample;
      }
    }

    async function decodeBlob(blob) {
      const ctx = ensureContext();
      const data = await blob.arrayBuffer();
      return ctx.decodeAudioData(data.slice(0));
    }

    function bufferDuration(buffer) {
      return buffer.length / buffer.sampleRate;
    }

    async function applyPaTreatment(voiceBuffer) {
      const sampleRate = 48000;
      const length = Math.ceil(bufferDuration(voiceBuffer) * sampleRate);
      const ctx = new OfflineAudioContext(1, Math.max(1, length), sampleRate);

      const source = ctx.createBufferSource();
      source.buffer = voiceBuffer;

      const highpass = ctx.createBiquadFilter();
      highpass.type = "highpass";
      highpass.frequency.value = 360;
      highpass.Q.value = 0.7;

      const presence = ctx.createBiquadFilter();
      presence.type = "peaking";
      presence.frequency.value = 1750;
      presence.Q.value = 0.85;
      presence.gain.value = 3.2;

      const shaper = ctx.createWaveShaper();
      shaper.curve = distortionCurve(9);
      shaper.oversample = "2x";

      const lowpass = ctx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.value = 3100;
      lowpass.Q.value = 0.85;

      const compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -22;
      compressor.knee.value = 10;
      compressor.ratio.value = 5.5;
      compressor.attack.value = 0.004;
      compressor.release.value = 0.16;

      const voiceGain = ctx.createGain();
      voiceGain.gain.value = 1.05;

      const noise = ctx.createBufferSource();
      noise.buffer = makeNoiseBuffer(ctx, Math.max(1, length));
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.value = 2200;
      noiseFilter.Q.value = 0.6;
      const noiseGain = ctx.createGain();
      noiseGain.gain.value = 0.016;

      source.connect(highpass);
      highpass.connect(presence);
      presence.connect(shaper);
      shaper.connect(lowpass);
      lowpass.connect(compressor);
      compressor.connect(voiceGain);
      voiceGain.connect(ctx.destination);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(lowpass);

      source.start();
      noise.start();

      const rendered = await ctx.startRendering();
      addGrain(rendered.getChannelData(0));
      return rendered;
    }

    async function assembleAnnouncement(voiceBuffer) {
      const ding = await loadChime();
      const treated = await applyPaTreatment(voiceBuffer);
      const sampleRate = 48000;
      const dingLen = Math.ceil(bufferDuration(ding) * sampleRate);
      const voiceLen = treated.length;
      const gap = Math.round(sampleRate * 0.12);
      const total = dingLen + gap + voiceLen;
      const out = new OfflineAudioContext(1, total, sampleRate);

      const dingSource = out.createBufferSource();
      dingSource.buffer = ding;
      const dingGain = out.createGain();
      dingGain.gain.value = 0.95;
      dingSource.connect(dingGain);
      dingGain.connect(out.destination);
      dingSource.start(0);

      const voiceSource = out.createBufferSource();
      voiceSource.buffer = treated;
      voiceSource.connect(out.destination);
      voiceSource.start(bufferDuration(ding) + 0.12);

      return out.startRendering();
    }

    function encodeWav(buffer) {
      const samples = buffer.getChannelData(0);
      const pcm = new Int16Array(samples.length);
      for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }

      const bytes = pcm.length * 2;
      const header = new ArrayBuffer(44);
      const view = new DataView(header);
      const write = (offset, text) => {
        for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
      };

      write(0, "RIFF");
      view.setUint32(4, 36 + bytes, true);
      write(8, "WAVE");
      write(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, buffer.sampleRate, true);
      view.setUint32(28, buffer.sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      write(36, "data");
      view.setUint32(40, bytes, true);

      return new Blob([header, pcm.buffer], { type: "audio/wav" });
    }

    async function getProcessedBlob() {
      if (processedBlob) return processedBlob;
      if (!recordedBlob) throw new Error("No recording");
      setStatus("Processing");
      const voice = await decodeBlob(recordedBlob);
      const mixed = await assembleAnnouncement(voice);
      processedBlob = encodeWav(mixed);
      return processedBlob;
    }

    function stamp() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return (
        now.getFullYear() +
        pad(now.getMonth() + 1) +
        pad(now.getDate()) +
        "-" +
        pad(now.getHours()) +
        pad(now.getMinutes()) +
        pad(now.getSeconds())
      );
    }

    async function previewMix() {
      previewBtn.disabled = true;
      try {
        const blob = await getProcessedBlob();
        if (previewAudio) {
          previewAudio.pause();
          previewAudio = null;
        }
        previewAudio = new Audio(URL.createObjectURL(blob));
        previewAudio.onended = () => {
          previewBtn.disabled = false;
          setStatus("Recorded");
        };
        await previewAudio.play();
        setStatus("Preview");
        setNote("Playing the exported PA mix: chime, then your grainy announcement.");
      } catch (err) {
        previewBtn.disabled = false;
        setStatus("Recorded");
        setNote("Could not build the preview.", true);
      }
    }

    async function exportMix() {
      exportBtn.disabled = true;
      try {
        const blob = await getProcessedBlob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "pa-announcement-" + stamp() + ".wav";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        setStatus("Exported");
        setNote("Saved a WAV with the chime and a light PA grain on your voice.");
      } catch (err) {
        setNote("Could not export the announcement.", true);
      } finally {
        exportBtn.disabled = false;
        if (recordedBlob) setStatus(statusEl.textContent === "Exported" ? "Exported" : "Recorded");
      }
    }

    talkBtn.addEventListener("click", () => {
      if (recording) stopAnnouncement();
      else startAnnouncement();
    });
    previewBtn.addEventListener("click", previewMix);
    exportBtn.addEventListener("click", exportMix);
  </script>
</body>
</html>
